<div class="hero-scene text-center text-white">
    <div class="hero-scene-content"> 
        <h1>Vos réservations</h1>
    </div>
</div>

<div class="container text-center pb-3">
    <a href="/reserver" class="btn btn-primary">Réserver une table</a>
</div>

<!-- Conteneur qui recevra les réservations dynamiquement -->
<div class="container text-center allreservations" id="reservationsContainer">
    <!-- Les réservations seront injectées ici par le JS -->
</div>

<!-- UNE SEULE Modale pour l'annulation (placée en dehors de la boucle) -->
<div class="modal fade" id="AnnulationReservationModal" tabindex="-1" aria-labelledby="AnnulationReservationLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="AnnulationReservationLabel">Annuler ma réservation</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                Êtes-vous sûr de vouloir annuler cette réservation ?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                <button type="button" class="btn btn-primary" id="confirmDeleteBtn">Confirmer l'annulation</button>
            </div>
        </div>
    </div>
</div>
