<div class="hero-scene text-center text-white">
    <div class="hero-scene-content">
        <h1 id="pageTitle">Vos réservations</h1>
    </div>
</div>

<div class="container text-center pb-3">
    <a href="/reserver" class="btn btn-primary" id="btnNewBooking">Réserver une table</a>
</div>

<!-- Zone de filtre par date (Masquée par défaut, visible pour Admin/Restaurateur) -->
<div class="container mb-4 d-none" id="adminFilterContainer">
    <div class="row justify-content-center align-items-end g-3">
        <div class="col-md-5 col-lg-4 text-start">
            <label for="filterDateInput" class="form-label fw-bold">Filtrer par date précise :</label>
            <input type="date" id="filterDateInput" class="form-control">
        </div>
        <div class="col-md-4 col-lg-3 text-start">
            <button type="button" class="btn btn-outline-secondary w-100" id="resetFilterBtn">
                Voir toutes à venir
            </button>
        </div>
    </div>
</div>

<!-- Conteneur qui recevra les réservations dynamiquement -->
<div class="container text-center allreservations" id="reservationsContainer">
    <!-- Les réservations seront injectées ici par le JS -->
</div>

<!-- Modale d'annulation / suppression -->
<div class="modal fade" id="AnnulationReservationModal" tabindex="-1" aria-labelledby="AnnulationReservationLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="AnnulationReservationLabel">Annuler la réservation</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="modalDeleteBody">
                Êtes-vous sûr de vouloir annuler cette réservation ?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                <button type="button" class="btn btn-primary" id="confirmDeleteBtn">Confirmer l'annulation</button>
            </div>
        </div>
    </div>
</div>
