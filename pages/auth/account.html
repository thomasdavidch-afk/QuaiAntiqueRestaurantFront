<div class="hero-scene text-center text-white">
    <div class="hero-scene-content"> 
        <h1>Mon Compte</h1>
    </div>
</div>

<div class="container pb-5">

    <!-- INFORMATIONS PERSONNELLES (Visible par tous les utilisateurs connectés) -->
    <div class="card bg-dark text-white p-4 my-4">
        <h3 class="mb-3">Mes informations personnelles</h3>
        <form id="formulaireCompte">
            <div class="mb-3">
                <label for="NomInput" class="form-label">Nom</label>
                <input type="text" class="form-control" id="NomInput" placeholder="Votre nom">
            </div>
            <div class="mb-3">
                <label for="PrenomInput" class="form-label">Prénom</label>
                <input type="text" class="form-control" id="PrenomInput" placeholder="Votre prénom">
            </div>
            <div class="mb-3">
                <label for="AllergiesInput" class="form-label">Allergies</label>
                <input type="text" class="form-control" id="AllergiesInput" placeholder="Vos allergies (fruits de mer, arachides...)">
            </div>
            <div class="mb-3">
                <label for="ConvivesInput" class="form-label">Nombre de convives habituel</label>
                <input type="number" class="form-control" id="ConvivesInput" placeholder="Votre nombre de convives habituel">
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-primary">Mettre à jour</button>
                <button type="button" class="btn btn-danger">Supprimer mon compte</button>
            </div>
        </form>
        <div class="text-center pt-3">
            <a href="/editpassword" class="text-white text-decoration-underline">Cliquez ici pour modifier votre mot de passe</a>
        </div>
    </div>

    <!-- ESPACE D'ADMINISTRATION (Visible uniquement par l'Administrateur) -->
    <div data-show="admin" class="mt-5">
        <h2 class="text-warning mb-4"><i class="bi bi-shield-lock-fill me-2"></i>Administration du Restaurant</h2>

        <!-- Navigation par onglets -->
        <ul class="nav nav-tabs mb-4" id="adminTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="info-tab" data-bs-toggle="tab" data-bs-target="#info-panel" type="button" role="tab">
                    Horaires & Capacité
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="carte-tab" data-bs-toggle="tab" data-bs-target="#carte-panel" type="button" role="tab">
                    Plats & Catégories
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="menus-tab" data-bs-toggle="tab" data-bs-target="#menus-panel" type="button" role="tab">
                    Menus
                </button>
            </li>
        </ul>

        <!-- Contenu des onglets -->
        <div class="tab-content" id="adminTabsContent">

            <!-- ONGLET 1 : Informations du restaurant -->
            <div class="tab-pane fade show active" id="info-panel" role="tabpanel">
                <div class="card bg-dark text-white p-4">
                    <h4>Définir les informations du restaurant</h4>
                    <p class="text-muted fs-7">
                        <em>Rappel : Le restaurant ouvre du mardi au dimanche (durée du service : 2h).</em>
                    </p>
                    <form id="formRestaurantInfo">
                        <div class="mb-3">
                            <label for="maxConvives" class="form-label">Nombre maximum de convives</label>
                            <input type="number" class="form-control" id="maxConvives" placeholder="Ex: 50" required>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6 mb-3 mb-md-0">
                                <label for="horaireMidi" class="form-label">Horaire d'ouverture - Service du Midi</label>
                                <input type="text" class="form-control" id="horaireMidi" required>
                            </div>
                            <div class="col-md-6">
                                <label for="horaireSoir" class="form-label">Horaire d'ouverture - Service du Soir</label>
                                <input type="text" class="form-control" id="horaireSoir" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-warning">Enregistrer la configuration</button>
                    </form>
                </div>
            </div>

            <!-- ONGLET 2 : Carte & Catégories -->
            <div class="tab-pane fade" id="carte-panel" role="tabpanel">
                <div class="card bg-dark text-white p-4">
                    <h4>Gérer les plats à la carte</h4>
                    <div class="d-flex gap-2 my-3">
                        <button class="btn btn-outline-light" data-bs-toggle="modal" data-bs-target="#categoryModal">
                            + Gérer / Ajouter une catégorie
                        </button>
                        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#dishModal">
                            + Ajouter un plat
                        </button>
                    </div>

                    <!-- Conteneur d'affichage de la carte / des plats -->
                    <div id="listePlats" class="mt-3">
                        <!-- La liste des catégories et plats sera directement injectée ici par la fonction JS renderFoodsList -->
                    </div>
                </div>
            </div>

            <!-- ONGLET 3 : Menus -->
            <div class="tab-pane fade" id="menus-panel" role="tabpanel">
                <div class="card bg-dark text-white p-4">
                    <h4>Gérer les menus</h4>
                    <button class="btn btn-primary my-3 align-self-start" data-bs-toggle="modal" data-bs-target="#menuModal">
                        + Ajouter un menu
                    </button>

                    <div id="adminMenuList" class="mt-3">
                        <!-- Liste des menus injectée dynamiquement par le JS -->
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- MODAL : Modification d'un Plat -->
<div class="modal fade" id="editFoodModal" tabindex="-1" aria-labelledby="editFoodModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content bg-dark text-white border-light">
            <div class="modal-header border-secondary">
                <h5 class="modal-title text-warning" id="editFoodModalLabel">Modifier le plat</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fermer"></button>
            </div>
            <div class="modal-body">
                <form id="editFoodForm">
                    <input type="hidden" id="editFoodId">
                    <div class="mb-3">
                        <label for="editFoodTitle" class="form-label">Titre du plat</label>
                        <input type="text" class="form-control bg-secondary text-white border-0" id="editFoodTitle" required>
                    </div>
                    <div class="mb-3">
                        <label for="editFoodPrice" class="form-label">Prix (€)</label>
                        <input type="number" step="0.01" class="form-control bg-secondary text-white border-0" id="editFoodPrice" required>
                    </div>
                    <div class="mb-3">
                        <label for="editFoodDescription" class="form-label">Description</label>
                        <textarea class="form-control bg-secondary text-white border-0" id="editFoodDescription" rows="3"></textarea>
                    </div>
                    <div class="text-end mt-4">
                        <button type="button" class="btn btn-outline-light me-2" data-bs-dismiss="modal">Annuler</button>
                        <button type="submit" class="btn btn-warning">Enregistrer les modifications</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
